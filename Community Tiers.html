<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Community Tiers</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--card:#050505;--line:#171717;--ink:#EDEDEA;--mut:#7A7A76;--chip:#0B0B0B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:#000}
body{color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100vh}
body::before{content:"";position:fixed;inset:-20%;pointer-events:none;z-index:0;background:radial-gradient(40% 30% at 28% 18%,rgba(255,107,107,.11),transparent 70%),radial-gradient(35% 30% at 76% 72%,rgba(108,182,255,.1),transparent 70%);animation:drift 22s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(4%,3%) scale(1.08)}}
.wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:18px 18px 90px}
nav{display:flex;justify-content:space-between;align-items:center;padding:6px 0 30px}
.logo{font-weight:600;letter-spacing:-.02em;font-size:18px;display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:0;color:var(--ink);padding:0}
.dot{width:8px;height:8px;border-radius:50%;background:#555}
.dot.live{background:#7BD88F;box-shadow:0 0 0 0 rgba(123,216,143,.6);animation:ping 2s infinite}
@keyframes ping{to{box-shadow:0 0 0 10px rgba(123,216,143,0)}}
.tabs{display:flex;gap:4px;background:#0E0E0E;border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{border:0;background:none;color:var(--mut);padding:8px 16px;border-radius:999px;font:inherit;font-weight:500;cursor:pointer;transition:background .25s,color .25s}
.tabs button.on{background:var(--ink);color:#000}
h1{font-size:clamp(30px,6.5vw,52px);line-height:1.05;letter-spacing:-.035em;font-weight:600;margin:0 0 10px}
.hd p{color:var(--mut);margin:0 0 30px;font-size:16px;max-width:52ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;color:var(--ink);font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:transform .35s cubic-bezier(.2,.8,.2,1),border-color .25s}
.card:hover{transform:translateY(-4px);border-color:#3A3A3A}
.card b{font-size:19px;font-weight:600;letter-spacing:-.01em}
.card span{color:var(--mut);font-size:13px}
.bar{display:flex;gap:3px;height:6px;margin-top:14px;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%}
.back{background:none;border:0;color:var(--mut);font:inherit;cursor:pointer;padding:0 0 18px}
.back:hover{color:var(--ink)}
.seg{display:inline-flex;gap:4px;background:#0E0E0E;border:1px solid var(--line);border-radius:999px;padding:3px;margin:6px 0 24px}
.seg button{border:0;background:none;color:var(--mut);padding:9px 18px;border-radius:999px;font:inherit;font-weight:500;cursor:pointer;transition:background .25s,color .25s}
.seg button.on{background:var(--ink);color:#000}
.row{display:flex;gap:10px;margin-bottom:10px}
.lab{flex:none;width:62px;border-radius:14px;display:grid;place-items:center;font-weight:700;font-size:24px;color:#000}
.cells{flex:1;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;min-height:62px;transition:background .2s,border-color .2s}
.drop.over{background:#141414;border-color:#444}
.chip{background:var(--chip);border:1px solid #262626;border-radius:999px;padding:9px 15px;font-size:14px;font-weight:500;user-select:none;-webkit-user-select:none;white-space:nowrap}
.chip.dr{cursor:grab;touch-action:none;transition:border-color .2s}
.chip.dr:hover{border-color:#555}
.chip.dragging{opacity:.25}
.ghost{position:fixed;z-index:99;pointer-events:none;box-shadow:0 14px 34px rgba(0,0,0,.7);transform:scale(1.06);background:#222}
.note{color:var(--mut);font-size:14px;margin:0 0 16px}
.empty{color:var(--mut);padding:8px 4px}
.btn{border:0;background:var(--ink);color:#000;padding:12px 22px;border-radius:999px;font:inherit;font-weight:600;cursor:pointer;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.4;cursor:default}
.ghostb{background:none;border:1px solid #333;color:var(--ink);padding:8px 14px;border-radius:999px;font:inherit;font-weight:500;cursor:pointer;transition:background .2s,border-color .2s}
.ghostb:hover{border-color:#777}
.ghostb.on{background:var(--ink);color:#000;border-color:var(--ink)}
.form{display:flex;flex-direction:column;gap:12px;max-width:560px;margin-bottom:44px}
.form input,.form textarea{background:var(--card);border:1px solid var(--line);color:var(--ink);padding:14px 16px;border-radius:14px;font:inherit;resize:vertical;transition:border-color .2s}
.form input:focus,.form textarea:focus{outline:0;border-color:#666}
.err{color:#FF8A80;min-height:20px;font-size:14px}
.sub{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:500;margin:0 0 14px}
.sug{display:flex;gap:14px;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin-bottom:10px}
.sug b{display:block;font-size:17px;font-weight:600}
.sug span{color:var(--mut);font-size:13px}
.acts{display:flex;gap:8px;flex:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:#000;padding:11px 20px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:120}
.toast.on{opacity:1;transform:translate(-50%,0)}
.in .a{animation:up .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}
.in .chip{animation:pop .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*35ms + .25s)}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
@media (max-width:560px){.lab{width:48px;font-size:20px}.sug{flex-direction:column;align-items:flex-start}}
@media (prefers-reduced-motion:reduce){*,body::before{animation:none!important;transition:none!important}}

.bar2{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:22px}
label.btn{display:inline-flex;align-items:center}
.txt{background:var(--card);border:1px solid var(--line);color:var(--ink);padding:11px 16px;border-radius:999px;font:inherit;width:180px}
.txt:focus{outline:0;border-color:#666}
.lab.ed{display:flex;flex-direction:column;gap:6px;width:104px;padding:8px;text-align:center;font-size:inherit}
.nm{font-size:22px;font-weight:700;max-width:90px;min-width:20px;word-break:break-word;outline:0;border-radius:4px}
.nm:focus{outline:2px solid rgba(0,0,0,.5);outline-offset:2px}
.ctl{display:flex;gap:6px;align-items:center}
.ctl input{width:24px;height:24px;border:0;padding:0;background:none;cursor:pointer}
.ctl button{width:24px;height:24px;border:0;border-radius:50%;background:rgba(0,0,0,.35);color:#fff;cursor:pointer;line-height:1;padding:0}
.item{position:relative;width:88px;height:88px;border-radius:12px;overflow:hidden;flex:none;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;background:#333;color:#fff;display:grid;place-items:center;font-weight:600;font-size:14px;text-align:center;padding:4px;word-break:break-word;border:1px solid #262626}
.item img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.item .x{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;font-size:14px;line-height:1;cursor:pointer;display:none;padding:0}
.item:hover .x{display:block}
@media (pointer:coarse){.item .x{display:block}}
.item.dragging{opacity:.25}
.cells.pool{min-height:104px}
.in .item{animation:pop .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*30ms + .2s)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:16px;z-index:130}
.ov.on{display:flex}
.ov img{max-width:100%;max-height:78vh;border-radius:14px}
.ov p{margin:0;color:var(--mut);text-align:center}
@media (max-width:560px){.lab.ed{width:84px}.nm{font-size:18px}.item{width:72px;height:72px;font-size:12px}.txt{width:140px}.tabs button{padding:8px 11px}}

/* ---- sharp, dark, professional skin ---- */
*,*::before,*::after{border-radius:0!important}
body::before{display:none}
.wrap{max-width:1040px}
nav{border-bottom:1px solid var(--line);padding:6px 0 18px;margin-bottom:34px}
.logo{font-size:13px;font-weight:700;letter-spacing:.28em}
.dot{width:8px;height:8px;background:#3A3A3A}
.dot.live{background:#3F8A55;animation:none;box-shadow:none}
.tabs{background:none;border:0;padding:0;gap:0}
.tabs button{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:10px 18px;border:1px solid var(--line);margin-left:-1px;color:var(--mut)}
.tabs button.on{background:var(--ink);color:#000;border-color:var(--ink)}
.seg{background:none;border:0;padding:0;gap:0}
.seg button{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:10px 20px;border:1px solid var(--line);margin-left:-1px}
.seg button.on{border-color:var(--ink)}
h1{font-weight:600;letter-spacing:-.03em}
.hd p{font-size:15px}
.card{background:var(--card);border:1px solid var(--line);padding:22px 22px 20px}
.card:hover{transform:translateY(-2px);border-color:#4A4A4A}
.card b{font-size:17px}
.bar{height:5px;gap:2px;margin-top:18px}
.lab{color:#fff;font-size:22px}
.lab.ed{color:inherit}
.cells{background:var(--card);border:1px solid var(--line)}
.drop.over{background:#0C0C0C;border-color:#555}
.row{gap:2px;margin-bottom:2px}
.chip{background:var(--chip);border:1px solid #1F1F1F;font-size:13px;font-weight:500;padding:9px 14px}
.chip.dr:hover{border-color:#555}
.item{border:1px solid #1F1F1F;background:#1A1A1A}
.ghost{background:#111;box-shadow:0 14px 34px rgba(0,0,0,.85);border:1px solid #444}
.btn,.ghostb{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:12px 20px;border:1px solid var(--ink)}
.btn{background:var(--ink);color:#000}
.btn:hover{background:#fff}
.ghostb{background:none;color:var(--ink);border-color:#2C2C2C;padding:10px 16px}
.ghostb:hover{border-color:#8A8A8A}
.ghostb.on{background:var(--ink);color:#000;border-color:var(--ink)}
.txt,.form input,.form textarea{background:var(--card);border:1px solid #222;padding:12px 14px}
.txt:focus,.form input:focus,.form textarea:focus{border-color:#8A8A8A}
.sug{background:var(--card);border:1px solid var(--line)}
.toast{background:var(--ink);border:1px solid #fff;font-size:13px;letter-spacing:.04em}
.back{font-size:12px;letter-spacing:.1em;text-transform:uppercase}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (max-width:560px){.tabs button{padding:9px 10px;letter-spacing:.06em}}
</style>
</head>
<body>
<div class="wrap">
  <nav><button class="logo" data-go="make" type="button"><span class="dot" id="dot"></span><span>TIERS</span></button><div class="tabs" id="tabs"><button data-go="make" type="button">Create</button><button data-go="home" type="button">Community</button><button data-go="suggest" type="button">Suggest</button></div></nav>
  <main id="main"></main>
</div>
<div class="ov" id="ov"><img id="out" alt="Your tier list"><p>Press and hold the image (or right-click) to save it.</p><button class="btn" id="ovx" type="button">Close</button></div>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var TL=['S','A','B','C','D'],TC=['#B33A3A','#B8691F','#9C8A2E','#3F8A55','#3A74A8'];
var DEF=[
 {id:'d-snacks',title:'Canteen snacks',items:['Samosa','Chai','Maggi','Aloo paratha','Bread pakora','Cold coffee','Momos','Chhole bhature']},
 {id:'d-spots',title:'Campus hangout spots',items:['The quad lawn','Library reading room','Canteen','Sports ground','Society hub steps','Auditorium balcony','Photocopy shop queue']},
 {id:'d-fest',title:'Fest moments',items:['Dandiya Night','Freshers','Open mic','Debate finals','Trivia night','Rooftop movie night','Farewell']}
];
var st={lists:[],sugg:[],votes:{},sv:{}},UID='me',ADMIN=true,CAN=true,DBX=null,view='make',cur=null,tab='c',draft={},tt=0,sugDraft=null;
var LK='tiers-demo-v1';
function lload(){try{var d=JSON.parse(localStorage.getItem(LK));if(d)st={lists:d.lists||[],sugg:d.sugg||[],votes:d.votes||{},sv:d.sv||{}}}catch(e){}}
function lsave(){try{localStorage.setItem(LK,JSON.stringify(st))}catch(e){}}
function toast(t){var e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){e.classList.remove('on')},2200)}
function all(){return DEF.concat(st.lists)}
function find(id){return all().filter(function(l){return l.id===id})[0]}
function agg(L){var s={},c={},n=0;Object.keys(st.votes).forEach(function(u){var p=(st.votes[u]||{})[L.id];if(!p||typeof p!=='object')return;n++;Object.keys(p).forEach(function(k){var v=+p[k];if(v>=1&&v<=5){s[k]=(s[k]||0)+v;c[k]=(c[k]||0)+1}})});return{s:s,c:c,n:n}}
function tierOf(a){return a>=4.5?0:a>=3.5?1:a>=2.5?2:a>=1.5?3:4}
/* ---- views ---- */
function home(){
 var h='<div class="hd a"><h1>Where does campus land?</h1><p>Rank things together. Vote on a list, or suggest your own.</p></div><div class="grid">';
 all().forEach(function(L,i){var g=agg(L),d=[0,0,0,0,0],t=0;L.items.forEach(function(_,k){var id='i'+k;if(g.c[id]){d[tierOf(g.s[id]/g.c[id])]++;t++}});
  var bar=t?d.map(function(n,j){return n?'<i style="flex:'+n+';background:'+TC[j]+'"></i>':''}).join(''):'<i style="flex:1;background:#242424"></i>';
  h+='<button class="card a" style="--i:'+(i+1)+'" data-open="'+esc(L.id)+'" type="button"><b>'+esc(L.title)+'</b><span>'+L.items.length+' items &middot; '+g.n+' vote'+(g.n===1?'':'s')+'</span><div class="bar">'+bar+'</div></button>'});
 return h+'</div>';
}
function chip(n,i,extra){return '<span class="chip'+(extra&&extra.dr?' dr':'')+'" style="--i:'+i+'"'+(extra&&extra.id?' data-id="'+extra.id+'"':'')+(extra&&extra.t?' title="'+esc(extra.t)+'"':'')+'>'+esc(n)+'</span>'}
function listView(L){
 var h='<button class="back a" data-go="home" type="button">&larr; All lists</button><div class="hd a" style="--i:1"><h1>'+esc(L.title)+'</h1></div><div class="seg a" style="--i:2"><button data-tab="c" class="'+(tab==='c'?'on':'')+'" type="button">Community</button><button data-tab="m" class="'+(tab==='m'?'on':'')+'" type="button">Your vote</button></div>';
 return h+(tab==='c'?comm(L):mine(L));
}
function comm(L){
 var g=agg(L),rows=[[],[],[],[],[]],un=[],h='';
 L.items.forEach(function(n,k){var id='i'+k;if(g.c[id]){var a=g.s[id]/g.c[id];rows[tierOf(a)].push({n:n,a:a,c:g.c[id]})}else un.push(n)});
 if(!g.n)h+='<p class="note a" style="--i:3">No votes yet. Be the first to rank this list.</p>'; else h+='<p class="note a" style="--i:3">'+g.n+' vote'+(g.n===1?'':'s')+', updating live.</p>';
 var k=0;rows.forEach(function(r,j){r.sort(function(x,y){return y.a-x.a});h+='<div class="row a" style="--i:'+(j+3)+'"><div class="lab" style="background:'+TC[j]+'">'+TL[j]+'</div><div class="cells">'+r.map(function(x){return chip(x.n,k++,{t:'Average '+x.a.toFixed(1)+' from '+x.c+' vote'+(x.c===1?'':'s')})}).join('')+'</div></div>'});
 if(un.length)h+='<div class="row a" style="--i:8"><div class="lab" style="background:#222;color:#888">?</div><div class="cells">'+un.map(function(n){return chip(n,k++)}).join('')+'</div></div>';
 return h;
}
function mine(L){
 var h='',k=0;
 if(!CAN)h+='<p class="note a" style="--i:3">Read-only: you need contributor access to vote.</p>'; else h+='<p class="note a" style="--i:3">Drag each item onto a tier, then save your ranking.</p>';
 for(var t=5;t>=1;t--){var j=5-t;h+='<div class="row a" style="--i:'+(j+3)+'"><div class="lab" style="background:'+TC[j]+'">'+TL[j]+'</div><div class="cells drop" data-t="'+t+'">'+L.items.map(function(n,i){return draft['i'+i]===t?chip(n,k++,{dr:1,id:'i'+i}):''}).join('')+'</div></div>'}
 h+='<p class="sub a" style="--i:8;margin-top:22px">Unplaced</p><div class="cells drop a" style="--i:9" data-t="0">'+L.items.map(function(n,i){return draft['i'+i]?'':chip(n,k++,{dr:1,id:'i'+i})}).join('')+'</div>';
 return h+'<p style="margin-top:22px" class="a" style="--i:10"><button class="btn" id="save" type="button"'+(CAN?'':' disabled')+'>Save my ranking</button></p>';
}
function sugView(){
 var sd=sugDraft||{title:'',items:[]};var cnt=function(id){var n=0;Object.keys(st.sv).forEach(function(u){if((st.sv[u]||{})[id])n++});return n};
 var h='<div class="hd a"><h1>Suggest a tier list</h1><p>Pitch a list. The community upvotes, and the best ones go live.</p></div><div class="form a" style="--i:1"><input id="stl" maxlength="60" value="'+esc(sd.title)+'" placeholder="List title, e.g. Best chai spots" aria-label="List title"><textarea id="sit" rows="6" placeholder="One item per line (3 to 20)" aria-label="Items">'+esc(sd.items.join('\n'))+'</textarea><div class="err" id="serr"></div><div><button class="btn" id="ssend" type="button"'+(CAN?'':' disabled')+'>Submit suggestion</button></div></div><p class="sub a" style="--i:2">Community suggestions</p>';
 var S=st.sugg.slice().sort(function(a,b){return cnt(b.id)-cnt(a.id)||b.ts-a.ts});
 if(!S.length)h+='<p class="empty">Nothing suggested yet. Yours could be first.</p>';
 S.forEach(function(s,i){var mine=(st.sv[UID]||{})[s.id],n=cnt(s.id);h+='<div class="sug a" style="--i:'+(i+3)+'"><div><b>'+esc(s.title)+'</b><span>'+esc(s.items.slice(0,5).join(', '))+(s.items.length>5?' +'+(s.items.length-5)+' more':'')+'</span></div><div class="acts"><button class="ghostb'+(mine?' on':'')+'" data-up="'+esc(s.id)+'" type="button"'+(CAN?'':' disabled')+'>&#9650; '+n+'</button>'+(ADMIN?'<button class="ghostb" data-ap="'+esc(s.id)+'" type="button">Approve</button>':'')+'</div></div>'});
 return h;
}
function render(anim,force){
 var m=$('#main'),ae=document.activeElement;
 if(!anim&&!force&&ae&&(/INPUT|TEXTAREA/.test(ae.tagName)||ae.isContentEditable)&&m.contains(ae))return;
 if(drag&&drag.on)return;
 m.className=anim?'in':'';
 var L=view==='list'?find(cur):null;
 m.innerHTML=view==='make'?makeView():view==='suggest'?sugView():(L?listView(L):home());
 $('#tabs').querySelectorAll('button').forEach(function(b){b.classList.toggle('on',b.dataset.go===(view==='suggest'?'suggest':view==='make'?'make':'home'))});
 $('#dot').className='dot'+(DBX?' live':'');$('#dot').title=DBX?'Live':'Demo mode: stored on this device only';
}
function go(v,id){view=v;cur=id||null;tab='c';if(v!=='suggest')sugDraft=null;if(v==='list'){var L=find(id);draft=Object.assign({},((st.votes[UID]||{})[id])||{})}render(true);scrollTo(0,0)}
/* ---- personal tier maker (the default) ---- */
var MKEY='tiers-maker-v1',mk=null,MCOL=['#B33A3A','#B8691F','#9C8A2E','#3F8A55','#3A74A8','#7655A8','#A84A80'],TILE=['#1F3347','#35264D','#17402F','#4D221C','#4A3B12','#232B36'],mu=0,rt=0;
var mid=function(){return 'm'+Date.now().toString(36)+(mu++)};
function mdef(){mk={title:'My tier list',tiers:['S','A','B','C','D'].map(function(n,i){return{id:mid(),name:n,color:TC[i],items:[]}}),pool:[]}}
function mload(){try{var d=JSON.parse(localStorage.getItem(MKEY));if(d&&Array.isArray(d.tiers)&&Array.isArray(d.pool)){mk=d;return}}catch(e){}mdef()}
function msave(){try{localStorage.setItem(MKEY,JSON.stringify(mk))}catch(e){}}
function ink(h){var n=parseInt(String(h).slice(1),16)||0,l=(.299*(n>>16)+.587*(n>>8&255)+.114*(n&255))/255;return l>.6?'#111111':'#FFFFFF'}
function mlists(){return [mk.pool].concat(mk.tiers.map(function(t){return t.items}))}
function mtake(id){var L=mlists();for(var i=0;i<L.length;i++)for(var j=0;j<L[i].length;j++)if(L[i][j].id===id)return L[i].splice(j,1)[0];return null}
function mlist(k){if(k==='pool')return mk.pool;var t=mk.tiers.filter(function(z){return z.id===k})[0];return t?t.items:null}
function mitem(it,i){var inner=it.src?'<img src="'+esc(it.src)+'" alt="">':esc(it.text||'');return '<div class="item" style="--i:'+i+(it.src?'':';background:'+esc(it.bg||'#333'))+'" data-id="'+esc(it.id)+'">'+inner+'<button class="x" data-rm="'+esc(it.id)+'" type="button" aria-label="Remove item">&times;</button></div>'}
function makeView(){
 var k=0,h='<div class="hd a"><h1 id="mttl" contenteditable="true" spellcheck="false" aria-label="Tier list title">'+esc(mk.title)+'</h1><p>Drag items onto tiers. Rename tiers, change colours, export when you are done.</p></div>';
 h+='<div class="bar2 a" style="--i:1"><label class="btn" for="mfile">Add images</label><input id="mfile" type="file" accept="image/*" multiple hidden><input class="txt" id="mtxt" maxlength="30" placeholder="Or type an item" aria-label="Text item"><button class="ghostb" id="madd" type="button">Add text</button><button class="ghostb" id="mtier" type="button">Add tier</button><button class="ghostb" id="mexp" type="button">Export image</button><button class="ghostb" id="mrst" type="button">Reset</button></div>';
 mk.tiers.forEach(function(t,j){h+='<div class="row a" style="--i:'+(j+2)+'"><div class="lab ed" style="background:'+esc(t.color)+';color:'+ink(t.color)+'"><div class="nm" contenteditable="true" spellcheck="false" data-nm="'+esc(t.id)+'" aria-label="Tier name">'+esc(t.name)+'</div><div class="ctl"><input type="color" value="'+esc(t.color)+'" data-col="'+esc(t.id)+'" aria-label="Tier colour"><button data-deltier="'+esc(t.id)+'" type="button" aria-label="Delete tier">&times;</button></div></div><div class="cells drop" data-m="'+esc(t.id)+'">'+t.items.map(function(it){return mitem(it,k++)}).join('')+'</div></div>'});
 h+='<p class="sub a" style="--i:8;margin-top:24px">Unsorted: drag items onto a tier</p><div class="cells drop pool a" style="--i:9" data-m="pool">'+(mk.pool.length?mk.pool.map(function(it){return mitem(it,k++)}).join(''):'<span class="empty">Add images or text above.</span>')+'</div>';
 return h+'<p class="note a" style="--i:10;margin-top:22px">Want the community to rank it? <button class="ghostb" id="msug" type="button">Suggest as a community list</button></p>';
}
function fit(f){return new Promise(function(res){var im=new Image(),u=URL.createObjectURL(f);im.onload=function(){var q=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=200;c.getContext('2d').drawImage(im,(im.width-q)/2,(im.height-q)/2,q,q,0,0,200,200);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.82))};im.onerror=function(){URL.revokeObjectURL(u);res(null)};im.src=u})}
function wr(c,t,x,y,mw,lh,max){var w=String(t).split(/\s+/),ln=[],cur2='';w.forEach(function(q){var z=cur2?cur2+' '+q:q;if(c.measureText(z).width>mw&&cur2){ln.push(cur2);cur2=q}else cur2=z});ln.push(cur2);ln=ln.slice(0,max);var y0=y-(ln.length-1)*lh/2;ln.forEach(function(l,i){c.fillText(l,x,y0+i*lh)})}
function mexport(){
 var all2=[];mk.tiers.forEach(function(t){t.items.forEach(function(i){all2.push(i)})});var imgs={};
 Promise.all(all2.filter(function(i){return i.src}).map(function(i){return new Promise(function(r){var im=new Image();im.onload=function(){imgs[i.id]=im;r()};im.onerror=r;im.src=i.src})})).then(function(){
  var W2=1200,LW=170,S=100,G=6,per=Math.floor((W2-LW-G)/(S+G)),hs=mk.tiers.map(function(t){return Math.max(110,Math.max(1,Math.ceil(t.items.length/per))*(S+G)+G)}),H2=76+hs.reduce(function(a,b){return a+b},0);
  var cv=document.createElement('canvas');cv.width=W2;cv.height=H2;var c=cv.getContext('2d');c.fillStyle='#000';c.fillRect(0,0,W2,H2);
  c.textAlign='center';c.textBaseline='middle';c.fillStyle='#F5F5F2';c.font='700 36px system-ui,sans-serif';c.fillText(mk.title,W2/2,38);
  var y=76;mk.tiers.forEach(function(t,k){var h=hs[k];c.fillStyle=t.color;c.fillRect(0,y,LW,h);c.fillStyle=ink(t.color);c.font='700 34px system-ui,sans-serif';wr(c,t.name,LW/2,y+h/2,LW-24,38,3);c.fillStyle='#0B0B0B';c.fillRect(LW,y,W2-LW,h);
   t.items.forEach(function(it,j){var x=LW+G+(j%per)*(S+G),yy=y+G+Math.floor(j/per)*(S+G);if(imgs[it.id])c.drawImage(imgs[it.id],x,yy,S,S);else{c.fillStyle=it.bg||'#333';c.fillRect(x,yy,S,S);c.fillStyle='#FFF';c.font='600 15px system-ui,sans-serif';wr(c,it.text||'',x+S/2,yy+S/2,S-12,18,4)}});y+=h});
  $('#out').src=cv.toDataURL('image/png');$('#ov').classList.add('on')});
}
function mtext(){var i=$('#mtxt'),v=i&&i.value.trim();if(!v)return;mk.pool.push({id:mid(),text:v,bg:TILE[v.length%TILE.length]});msave();render(false,true);var n=$('#mtxt');if(n)n.focus()}
function mclick(b){
 if(b.id==='madd'){mtext();return true}
 if(b.id==='mtier'){mk.tiers.push({id:mid(),name:'New',color:MCOL[mk.tiers.length%MCOL.length],items:[]});msave();render(false);return true}
 if(b.id==='mexp'){mexport();return true}
 if(b.id==='ovx'){$('#ov').classList.remove('on');return true}
 if(b.id==='mrst'){if(!rt){b.textContent='Tap again to reset';rt=setTimeout(function(){rt=0;b.textContent='Reset'},3000)}else{clearTimeout(rt);rt=0;mdef();msave();render(true)}return true}
 if(b.id==='msug'){var names=[];mk.tiers.forEach(function(t){t.items.forEach(function(i){if(i.text)names.push(i.text)})});mk.pool.forEach(function(i){if(i.text)names.push(i.text)});if(names.length<3){toast('Add at least 3 text items to suggest it.');return true}sugDraft={title:mk.title,items:names.slice(0,20)};go('suggest');return true}
 if(b.dataset.rm){mtake(b.dataset.rm);msave();render(false);return true}
 if(b.dataset.deltier){var t=mk.tiers.filter(function(z){return z.id===b.dataset.deltier})[0];if(t){mk.pool=mk.pool.concat(t.items);mk.tiers=mk.tiers.filter(function(z){return z!==t});msave();render(false)}return true}
 return false;
}
document.addEventListener('change',function(e){if(e.target.id!=='mfile')return;var fl=[].slice.call(e.target.files);e.target.value='';Promise.all(fl.map(fit)).then(function(a){a.forEach(function(x){if(x)mk.pool.push({id:mid(),src:x})});msave();render(false)})});
document.addEventListener('input',function(e){var t=e.target,T;
 if(t.id==='mttl'){mk.title=t.textContent;msave()}
 else if(t.dataset&&t.dataset.nm){T=mk.tiers.filter(function(z){return z.id===t.dataset.nm})[0];if(T){T.name=t.textContent;msave()}}
 else if(t.dataset&&t.dataset.col){T=mk.tiers.filter(function(z){return z.id===t.dataset.col})[0];if(T){T.color=t.value;var l=t.closest('.lab');l.style.background=T.color;l.style.color=ink(T.color);msave()}}
 else if(t.id==='stl'||t.id==='sit'){sugDraft={title:$('#stl').value,items:$('#sit').value.split('\n')}}});
document.addEventListener('keydown',function(e){if(e.key!=='Enter')return;var t=e.target;if(t.id==='mtxt'){e.preventDefault();mtext()}else if(t.id==='mttl'||(t.classList&&t.classList.contains('nm'))){e.preventDefault();t.blur()}});
/* ---- writes ---- */
function wVotes(){if(DBX)return DBX.doc('votes/'+UID).set({picks:st.votes[UID]||{}});lsave();return Promise.resolve()}
function wSv(){if(DBX)return DBX.doc('sv/'+UID).set({ids:st.sv[UID]||{}});lsave();return Promise.resolve()}
document.addEventListener('click',function(e){
 var b=e.target.closest('button');if(!b)return;
 if(mclick(b))return;
 if(b.dataset.go)go(b.dataset.go);
 else if(b.dataset.open)go('list',b.dataset.open);
 else if(b.dataset.tab){tab=b.dataset.tab;render(true)}
 else if(b.id==='save'){var L=find(cur);if(!L||!CAN)return;st.votes[UID]=Object.assign({},st.votes[UID]||{});st.votes[UID][L.id]=Object.assign({},draft);wVotes().then(function(){toast('Ranking saved');tab='c';render(true)},function(){toast('Could not save. Check your access.')})}
 else if(b.dataset.up){var id=b.dataset.up;st.sv[UID]=Object.assign({},st.sv[UID]||{});if(st.sv[UID][id])delete st.sv[UID][id];else st.sv[UID][id]=1;wSv().then(function(){render(false)},function(){toast('Could not save your vote.')});render(false)}
 else if(b.dataset.ap){var s=st.sugg.filter(function(z){return z.id===b.dataset.ap})[0];if(!s)return;
  if(DBX)DBX.doc('lists/'+s.id).set({title:s.title,items:s.items,by:s.by,ts:Date.now()}).then(function(){return DBX.doc('suggestions/'+s.id).delete()}).then(function(){toast('Approved. It is live.')},function(){toast('Could not approve.')});
  else{st.lists.push({id:s.id,title:s.title,items:s.items});st.sugg=st.sugg.filter(function(z){return z!==s});lsave();render(false);toast('Approved. It is live.')}}
 else if(b.id==='ssend'){
  var t=$('#stl').value.trim().slice(0,60),seen={},it=[];$('#sit').value.split('\n').forEach(function(x){x=x.trim().slice(0,40);var k=x.toLowerCase();if(x&&!seen[k]){seen[k]=1;it.push(x)}});
  var er=$('#serr');if(t.length<3){er.textContent='Give your list a title.';return}if(it.length<3){er.textContent='Add at least 3 items, one per line.';return}if(it.length>20){er.textContent='Keep it to 20 items or fewer.';return}
  sugDraft=null;var s2={id:'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),title:t,items:it,by:UID,ts:Date.now()};
  if(DBX)DBX.doc('suggestions/'+s2.id).set({title:t,items:it,by:UID,ts:s2.ts}).then(function(){toast('Suggestion sent');render(true)},function(){er.textContent='Could not send. Check your access.'});
  else{st.sugg.push(s2);lsave();toast('Suggestion sent');render(true)}}
});
/* ---- drag to place (mouse + touch) ---- */
var drag=null;
document.addEventListener('pointerdown',function(e){var c=e.target.closest('.chip.dr,.item');if(!c||e.button>0||e.target.closest('.x')||(!CAN&&!c.classList.contains('item')))return;drag={id:c.dataset.id,el:c,sx:e.clientX,sy:e.clientY,on:false}});
document.addEventListener('pointermove',function(e){
 if(!drag)return;
 if(!drag.on){if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<6)return;drag.on=true;var r=drag.el.getBoundingClientRect();drag.g=drag.el.cloneNode(true);var it0=drag.el.classList.contains('item');drag.g.className=it0?'item ghost':'chip ghost';if(it0){drag.g.style.width=r.width+'px';drag.g.style.height=r.height+'px'}drag.g.style.animation='none';drag.dx=e.clientX-r.left;drag.dy=e.clientY-r.top;document.body.appendChild(drag.g);drag.el.classList.add('dragging')}
 drag.g.style.left=(e.clientX-drag.dx)+'px';drag.g.style.top=(e.clientY-drag.dy)+'px';
 var t=document.elementFromPoint(e.clientX,e.clientY);t=t&&t.closest('.drop');if(drag.t!==t){if(drag.t)drag.t.classList.remove('over');drag.t=t;if(t)t.classList.add('over')}
 if(e.clientY<70)scrollBy(0,-14);else if(e.clientY>innerHeight-70)scrollBy(0,14);
});
function end(e){
 if(!drag)return;var d=drag;drag=null;if(!d.on)return;
 d.g.remove();if(d.t)d.t.classList.remove('over');
 if(d.t&&e.type!=='pointercancel'){
  if(d.t.dataset.m!==undefined){var kids=[].slice.call(d.t.querySelectorAll('.item')).filter(function(k){return k!==d.el}),pos=kids.length;
   for(var i=0;i<kids.length;i++){var rc=kids[i].getBoundingClientRect();if(e.clientY<rc.top||(e.clientY<rc.bottom&&e.clientX<rc.left+rc.width/2)){pos=i;break}}
   var it=mtake(d.id),L=mlist(d.t.dataset.m);if(it&&L)L.splice(pos,0,it);else if(it)mk.pool.push(it);msave()}
  else{var v=+d.t.dataset.t;if(v)draft[d.id]=v;else delete draft[d.id]}}
 render(false);
}
document.addEventListener('pointerup',end);document.addEventListener('pointercancel',end);
/* ---- live data (shared db when available, otherwise a local demo) ---- */
async function init(){
 lload();mload();
 try{
  if(typeof claude!=='undefined'&&claude.use){
   var user=await claude.use('user'),db=await claude.use('db');
   if(user&&db){
    var id=await user.id(),cw=await user.can('data.write');
    UID=id||'viewer';CAN=!!id&&cw!==false;ADMIN=await user.canEdit();DBX=db;st={lists:[],sugg:[],votes:{},sv:{}};
    var obj=function(x){return x&&typeof x==='object'?x:{}};
    db.collection('votes').onSnapshot(function(s){var v={};s.docs.forEach(function(d){v[d.id]=obj(obj(d.data()).picks)});st.votes=v;render(false)},function(){});
    db.collection('sv').onSnapshot(function(s){var v={};s.docs.forEach(function(d){v[d.id]=obj(obj(d.data()).ids)});st.sv=v;render(false)},function(){});
    var mk=function(d){var x=obj(d.data());return{id:d.id,title:String(x.title||'').slice(0,60),items:Array.isArray(x.items)?x.items.slice(0,20).map(function(i){return String(i).slice(0,40)}):[],by:x.by,ts:+x.ts||0}};
    db.collection('lists').onSnapshot(function(s){st.lists=s.docs.map(mk).filter(function(l){return l.title&&l.items.length>2});render(false)},function(){});
    db.collection('suggestions').onSnapshot(function(s){st.sugg=s.docs.map(mk).filter(function(l){return l.title&&l.items.length>2});render(false)},function(){});
   }
  }
 }catch(e){}
 render(true);
}
init();
})();
</script>
